# Puerto HTTP de notificacion-service.
server.port=8004

###################################################################################################################
# Direccion del broker Kafka. esa propiedad le dice a tu microservicio dónde está el broker de Kafka.
# localhost → Kafka está en la misma máquina desde la que ejecutas el microservicio.
# 9092 → puerto donde escucha Kafka
# Creamos e contenedor kafka así => docker run -d --name kafka -p 9092:9092 apache/kafka:4.3.1
#                                                          Puerto 9092 de Windows: Puerto 9092 del contenedor Kafka
# Por eso desde un microservicio que ejecutas en local desde STS/Eclipse puedes poner: 
# spring.kafka.bootstrap-servers=localhost:9092 =>  porque localhost significa “mi propio PC”.

# En un entorno como IGAE, si Kafka estuviera desplegado en un servidor o contenedor gestionado por infraestructura,
# tú no accederías por localhost. Te darían una dirección del broker o del clúster Kafka, por ejemplo:
# spring.kafka.bootstrap-servers=kafka01.igae.interno:9092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# define a qué Consumer Group pertenece tu consumidor Kafka.
# notificacion-service => pertenece al grupo notificaciones-group
# ¿Por qué existe un grupo? Porque Kafka usa el group-id para saber qué consumidores trabajan juntos sobre un mismo topic.
spring.kafka.consumer.group-id=notificaciones-group

# Si el grupo no tiene offset previo, empieza por los mensajes mas antiguos.
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializador de la key.“Cuando recibas la key del mensaje, conviértela desde bytes a String.Recuerda que en el producer hacíamos lo contrario:
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Deserializador del value JSON.Cuando recibas el value del mensaje, conviértelo desde JSON al objeto Java correspondiente
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.notificacion.service.eventos.CarroCreadoEvento